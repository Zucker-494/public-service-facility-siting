name: Build full robustness figure

on:
  push:
    branches:
      - cities-robustness-figure-1-40
    paths:
      - "src/40_cities_robustness_figure_1_40.py"
      - ".github/workflows/build_robustness_figure_1_40.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Generate figure
        run: python src/40_cities_robustness_figure_1_40.py
      - name: Validate figure
        run: |
          test -s manuscript/cities/figures/fig10_network_robustness_1_40.pdf
          test -s manuscript/cities/figures/fig10_network_robustness_1_40.png
      - name: Commit figure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manuscript/cities/figures/fig10_network_robustness_1_40.*
          git commit -m "Add full 1-40 robustness figure" || true
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: cities-robustness-figure-1-40
          path: manuscript/cities/figures/fig10_network_robustness_1_40.*
