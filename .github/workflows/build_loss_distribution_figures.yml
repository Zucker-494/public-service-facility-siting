name: Build loss-distribution figures

on:
  push:
    branches:
      - cities-loss-distribution-reframe
    paths:
      - "src/41_cities_loss_distribution_figures.py"
      - ".github/workflows/build_loss_distribution_figures.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Generate ECDF figures
        run: python src/41_cities_loss_distribution_figures.py
      - name: Validate figures
        run: |
          test -s manuscript/cities/figures/fig3_primary_first_step_ecdf.pdf
          test -s manuscript/cities/figures/fig8_population_weighted_ecdf.pdf
      - name: Commit figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manuscript/cities/figures/fig3_primary_first_step_ecdf.* manuscript/cities/figures/fig8_population_weighted_ecdf.*
          git commit -m "Add ECDF first-step decision-loss figures" || true
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: cities-loss-distribution-figures
          path: |
            manuscript/cities/figures/fig3_primary_first_step_ecdf.*
            manuscript/cities/figures/fig8_population_weighted_ecdf.*
