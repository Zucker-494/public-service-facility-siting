name: Build Cities final figure package

on:
  push:
    branches:
      - cities-final-package
    paths:
      - "src/34_cities_final_figures.py"
      - ".github/workflows/build_cities_final_package.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out revision branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Generate final Cities figures
        run: python src/34_cities_final_figures.py

      - name: Validate figure outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path("manuscript/cities")
          q=json.loads((root/"figure_qa.json").read_text())
          assert q["figure_count"] == 8
          for i in range(1,9):
              matches=list((root/"figures").glob(f"fig{i}_*.pdf"))
              assert len(matches)==1, (i,matches)
              matches_png=list((root/"figures").glob(f"fig{i}_*.png"))
              assert len(matches_png)==1, (i,matches_png)
          print("Cities figure validation passed")
          PY

      - name: Commit validated figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manuscript/cities/figures manuscript/cities/figure_qa.json
          if git diff --cached --quiet; then
            echo "No figure changes to commit."
          else
            git commit -m "Add final Cities manuscript figures"
            git push
          fi

      - name: Upload figure package
        uses: actions/upload-artifact@v4
        with:
          name: cities-final-figures
          path: |
            manuscript/cities/figures
            manuscript/cities/figure_qa.json
