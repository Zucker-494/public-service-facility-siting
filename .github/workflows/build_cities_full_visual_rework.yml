name: Build fully reworked Cities figures

on:
  push:
    branches:
      - cities-full-visual-rework
    paths:
      - "src/38_cities_full_visual_rework.py"
      - ".github/workflows/build_cities_full_visual_rework.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Generate all reworked figures
        run: python src/38_cities_full_visual_rework.py
      - name: Validate figure outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("manuscript/cities/figures_reworked")
          q=json.loads((p/"figure_qa.json").read_text())
          assert q["figure_count"]==10
          for i in range(1,11):
              assert len(list(p.glob(f"fig{i}_*.pdf")))==1
              assert len(list(p.glob(f"fig{i}_*.png")))==1
          print("all reworked figures validated")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cities-full-visual-rework
          path: manuscript/cities/figures_reworked
