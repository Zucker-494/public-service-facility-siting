name: Run Cities contribution analysis

on:
  push:
    branches:
      - cities-contribution-analysis
    paths:
      - "src/29_failure_condition_analysis.py"
      - "tests/test_v12_failure_conditions.py"
      - ".github/workflows/run_cities_contribution_analysis.yml"

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - name: Check out analysis branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight analysis dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy matplotlib pytest

      - name: Run condition and budget sensitivity analysis
        run: python src/29_failure_condition_analysis.py

      - name: Validate generated outputs
        run: python -m pytest -q tests/test_v12_failure_conditions.py

      - name: Commit validated analysis outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            outputs/sequential_investment/indicator_failure_conditions.csv \
            outputs/sequential_investment/failure_condition_correlations.csv \
            outputs/sequential_investment/indicator_failure_summary.csv \
            outputs/sequential_investment/budget_shortfall_trends.csv \
            outputs/sequential_investment/budget_phase_summary.csv \
            outputs/sequential_investment/budget_trajectory_summary.csv \
            outputs/sequential_investment/failure_condition_quality_gate.json \
            outputs/figures/all_figures_png/indicator_failure_conditions.png \
            outputs/figures/all_figures_png/budget_scale_effects.png
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "Add validated Cities contribution analysis outputs"
            git push
          fi
